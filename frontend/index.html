<!doctype html>
<html lang="es" class="theme-dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/default_favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b1021" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Listopic</title>
  <script>
    // Errores de arranque a Sentry. Va antes que cualquier módulo: si un chunk
    // falla al evaluarse (p. ej. React undefined por un ciclo entre chunks),
    // el SDK nunca llega a iniciarse. Cuando se inicia, deja de enviar.
    (function () {
      var m = /^(https?):\/\/([^@]+)@([^/]+)\/(\d+)$/.exec('%VITE_SENTRY_DSN%');
      var env = '%VITE_SENTRY_ENVIRONMENT%';
      if (env.charAt(0) === '%') env = '%MODE%' === 'production' ? 'production' : 'development';
      if (!m || env === 'development') return;
      var release = '%VITE_APP_RELEASE%';
      var url = m[1] + '://' + m[3] + '/api/' + m[4] + '/envelope/?sentry_version=7&sentry_key=' + m[2] + '&sentry_client=listopic-arranque%2F1';
      var sent = 0;
      var hex = function () { var s = ''; for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16); return s; };
      var frames = function (stack) {
        var out = [];
        String(stack || '').split('\n').forEach(function (line) {
          var f = /(?:at (.*?) \(?|^(.*?)@)?((?:https?|capacitor):\/\/[^\s)]+):(\d+):(\d+)/.exec(line);
          if (f) out.unshift({ function: f[1] || f[2] || '?', filename: f[3], abs_path: f[3], lineno: +f[4], colno: +f[5], in_app: true });
        });
        return out;
      };
      var debugImages = function () {
        var ids = window._sentryDebugIds, images = [], seen = {};
        for (var k in ids || {}) {
          var f = /((?:https?|capacitor):\/\/[^\s)]+?\.js)/.exec(k);
          if (f && !seen[f[1]]) { seen[f[1]] = 1; images.push({ type: 'sourcemap', code_file: f[1], debug_id: ids[k] }); }
        }
        return images;
      };
      var send = function (type, value, stack) {
        if (window.__lpSentryReady || sent >= 5) return;
        sent++;
        var id = hex();
        var cap = window.Capacitor;
        var event = {
          event_id: id, timestamp: Date.now() / 1000, platform: 'javascript', level: 'fatal', environment: env,
          release: release.charAt(0) === '%' ? undefined : release,
          tags: { fase: 'arranque', app_platform: cap && cap.getPlatform ? cap.getPlatform() : 'web' },
          request: { url: location.origin + location.pathname, headers: { 'User-Agent': navigator.userAgent } },
          exception: { values: [{ type: type, value: String(value).replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[correo]').slice(0, 500), stacktrace: { frames: frames(stack) }, mechanism: { type: 'onerror', handled: false } }] },
          debug_meta: { images: debugImages() }
        };
        var body = JSON.stringify({ event_id: id, sent_at: new Date().toISOString() }) + '\n' + JSON.stringify({ type: 'event' }) + '\n' + JSON.stringify(event);
        try { fetch(url, { method: 'POST', body: body, keepalive: true }); } catch (e) { /* sin red */ }
      };
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          // Solo los archivos propios: una fuente externa bloqueada no rompe la app.
          var src = t.src || t.href || '';
          if (src.indexOf(location.origin + '/') === 0) send('ChunkLoadError', 'No se pudo cargar ' + src.slice(location.origin.length), '');
        } else if (e.error || e.message) {
          send((e.error && e.error.name) || 'Error', (e.error && e.error.message) || e.message, e.error && e.error.stack);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        send((r && r.name) || 'UnhandledRejection', (r && r.message) || r, r && r.stack);
      });
    })();
  </script>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
  <script>
    // Apply saved theme class before first paint to avoid FOUC.
    (function () {
      try {
        var t = localStorage.getItem('listopic-theme');
        var valid = ['dark', 'light', 'warm', 'cool'];
        if (t && valid.indexOf(t) !== -1) {
          var html = document.documentElement;
          html.classList.remove('theme-dark', 'theme-light', 'theme-warm', 'theme-cool');
          html.classList.add('theme-' + t);
          html.setAttribute('data-theme', t);
          var bg = { dark: '#0b1021', light: '#faf8f4', warm: '#1a0f0c', cool: '#031a20' }[t];
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && bg) meta.setAttribute('content', bg);
          document.documentElement.style.backgroundColor = bg;
        }
      } catch (e) { /* private mode or storage blocked */ }
    })();
  </script>
  <style>
    body { margin: 0; }
    html, body { background-color: #0b1021; }
    html.theme-light, html.theme-light body { background-color: #faf8f4; }
    html.theme-warm, html.theme-warm body { background-color: #1a0f0c; }
    html.theme-cool, html.theme-cool body { background-color: #031a20; }
    @keyframes lp-spin { to { transform: rotate(360deg); } }
    #lp-boot {
      position: fixed; inset: 0;
      background: #0b1021;
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    html.theme-light #lp-boot { background: #faf8f4; }
    html.theme-warm #lp-boot { background: #1a0f0c; }
    html.theme-cool #lp-boot { background: #031a20; }
    #lp-boot-spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      animation: lp-spin 0.75s linear infinite;
    }
    html.theme-warm #lp-boot-spinner { border-color: rgba(249,115,22,0.2); border-top-color: #f97316; }
    html.theme-cool #lp-boot-spinner { border-color: rgba(20,184,166,0.2); border-top-color: #14b8a6; }
  </style>
  <!-- Default Open Graph Tags (Will be updated by SeoManager) -->
  <meta property="og:title" content="Listopic" />
  <meta property="og:description" content="Comparte y descubre listas." />
  <meta property="og:image" content="/default_favicon.svg" />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="lp-boot"><div id="lp-boot-spinner"></div></div>
  <div id="root"></div>
  <script>
    window.__listopicDeferredInstallPrompt = null;
    window.__listopicPwaInstalled = false;

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__listopicDeferredInstallPrompt = event;
      window.dispatchEvent(new CustomEvent('listopic:beforeinstallprompt'));
    });

    window.addEventListener('appinstalled', function () {
      window.__listopicDeferredInstallPrompt = null;
      window.__listopicPwaInstalled = true;
      window.dispatchEvent(new CustomEvent('listopic:appinstalled'));
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
