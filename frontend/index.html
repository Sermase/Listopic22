<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/default_favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1021" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Listopic</title>
  <!-- Default Open Graph Tags (Will be updated by SeoManager) -->
  <meta property="og:title" content="Listopic" />
  <meta property="og:description" content="Comparte y descubre listas." />
  <meta property="og:image" content="/default_favicon.svg" />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="root"></div>
  <script>
    window.__listopicDeferredInstallPrompt = null;
    window.__listopicPwaInstalled = false;

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__listopicDeferredInstallPrompt = event;
      window.dispatchEvent(new CustomEvent('listopic:beforeinstallprompt'));
    });

    window.addEventListener('appinstalled', function () {
      window.__listopicDeferredInstallPrompt = null;
      window.__listopicPwaInstalled = true;
      window.dispatchEvent(new CustomEvent('listopic:appinstalled'));
    });
  </script>
  <script>
    window.initMap = function () {
      console.log("Google Maps API loaded");
    };
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBV26T665w65z1FNdDk8mwHSH1o0c2PeW8&libraries=places,geometry&loading=async&callback=initMap"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
