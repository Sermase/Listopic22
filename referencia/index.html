    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#f8fafc', // Slate 50
              surface: '#ffffff',
              primary: '#4f46e5', // Indigo 600
              secondary: '#ec4899', // Pink 500
              tertiary: '#10b981', // Emerald 500
              text: {
                main: '#1e293b', // Slate 800
                muted: '#64748b', // Slate 500
                light: '#94a3b8'
              }
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              display: ['Poppins', 'sans-serif'],
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(135deg, #4f46e5 0%, #ec4899 100%)',
              'card-gradient': 'linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 100%)',
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        color: #1e293b;
      }
      /* Hide scrollbar for cleaner horizontal scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      /* Smooth styling for progress bars */
      progress::-webkit-progress-bar {
        background-color: #f1f5f9;
        border-radius: 99px;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #4f46e5, #ec4899);
        border-radius: 99px;
      }
    </style>
