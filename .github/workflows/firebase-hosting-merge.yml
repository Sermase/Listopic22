# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Lint frontend (informativo, no bloquea el deploy)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - name: Tests unitarios del frontend
        run: npm test
        working-directory: frontend
      - name: La clave de Algolia de la web solo puede buscar
        run: npm run check:algolia-key
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
          # Sentry: sin SENTRY_DSN no se envía nada; sin token no se suben source maps.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - name: No se publican source maps
        run: find dist -name '*.map' -print -delete
        working-directory: frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTOPIC }}
          channelId: live
          projectId: listopic
