# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Lint frontend (informativo, no bloquea el deploy)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - name: Tests unitarios del frontend
        run: npm test
        working-directory: frontend
      - name: Install functions deps
        run: npm ci
        working-directory: functions
      - name: Tests de Functions (notas, Algolia, visibilidad…)
        run: npm test
        working-directory: functions
      - name: La clave de Algolia de la web solo puede buscar
        run: npm run check:algolia-key
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
          # Sentry: sin SENTRY_DSN no se envía nada; sin token no se suben source maps.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - name: No se publican source maps
        run: find dist -name '*.map' -print -delete
        working-directory: frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTOPIC }}
          projectId: listopic
  rules_tests:
    # Tests de las reglas de Firestore con el emulador (no despliega nada).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test deps
        run: npm ci
        working-directory: firestore-tests
      - name: Firestore rules tests
        run: npm test
        working-directory: firestore-tests
  e2e:
    # Arranque (web y origen Capacitor), Home, Buscar, Lista, mapa, zona, login
    # y valoración con emuladores y Algolia simulado. Sin secretos ni producción.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install functions deps
        run: npm ci
        working-directory: functions
      - name: Install E2E deps
        run: npm ci
        working-directory: e2e
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E (build en modo emuladores + emuladores + Playwright)
        run: npm test
        working-directory: e2e
        env:
          CI: true
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
