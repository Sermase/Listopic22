name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Lint frontend (informativo, no bloquea el deploy)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - name: Tests unitarios del frontend
        run: npm test
        working-directory: frontend
      - name: Install functions deps
        run: npm ci
        working-directory: functions
      - name: Tests de Functions (notas, Algolia, visibilidad…)
        run: npm test
        working-directory: functions
      - name: La clave de Algolia de la web solo puede buscar
        run: npm run check:algolia-key
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTOPIC }}
          projectId: listopic
  rules_tests:
    # Tests de las reglas de Firestore con el emulador (no despliega nada).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test deps
        run: npm ci
        working-directory: firestore-tests
      - name: Firestore rules tests
        run: npm test
        working-directory: firestore-tests
