    <main>
        <div class="container">
            <section class="list-hero-card lp-hero">
                <div class="lp-hero-grid">
                    <div class="lp-hero-main">
                        <div class="lp-hero-eyebrow-row lp-hero-eyebrow-inline">
                            <span class="list-hero-subtitle lp-hero-chip is-accent" id="list-category-label">Lista destacada</span>
                            <div id="list-stats" class="list-hero-stats lp-hero-stats"></div>
                        </div>
                        <h1 class="lp-hero-title" id="list-title">[Cargando nombre de la lista...]</h1>
                    </div>
                    <div class="list-hero-actions lp-hero-actions">
                        <a href="review-form.html" role="button" class="list-hero-btn primary add-review-button">
                            <i class="fas fa-plus-circle"></i><span class="btn-label">Añadir reseña</span>
                        </a>
                        <button id="follow-list-btn" class="list-hero-btn follow" title="Seguir lista">
                            <i class="fas fa-bookmark"></i><span class="btn-label">Seguir</span>
                        </button>
                        <button type="button" id="show-map-modal-btn" class="list-hero-btn map-btn" title="Ver en mapa">
                            <i class="fas fa-map-marked-alt"></i><span class="btn-label">Mapa</span>
                        </button>
                        <button type="button" id="forum-button" class="list-hero-btn ghost forum-btn" title="Foro de la lista">
                            <i class="fas fa-comments"></i><span class="btn-label">Foro</span><span class="forum-count-badge" id="forum-count">0</span>
                        </button>
                    </div>
                </div>
                <div class="search-filter-container">
                    <div class="search-filter-row">
                        <input type="search" placeholder="Buscar en la lista..." class="search-input form-input">
                        <button
                            type="button"
                            id="show-filters-modal-btn"
                            class="filter-icon-btn"
                            aria-label="Mostrar filtros"
                            title="Filtros"
                        >
                            <i class="fas fa-filter"></i>
                        </button>
                    </div>
                </div>
            </section>
            
            <div id="list-map-modal" class="modal">
                <div class="modal-content map-modal-content">
                    <span class="close-modal" id="close-map-modal-btn" title="Cerrar mapa">&times;</span>
                    <h2 id="map-modal-title">Mapa de la Lista</h2>
                    <div class="map-modal-toolbar">
                        <button type="button" id="map-filters-btn" class="button secondary-button">
                            <i class="fas fa-filter"></i> Filtros
                        </button>
                    </div>
                    <div id="list-map-container">
                        <button
                            type="button"
                            id="map-center-user-btn"
                            class="map-center-control"
                            aria-label="Centrar en mi ubicación"
                            title="Centrar en mi ubicación"
                        >
                            <i class="fas fa-compass" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="tag-filter-container">
                <p>Cargando filtros...</p>
            </div>

            <!-- Modal de filtros adicionales -->
            <div id="extra-filters-modal" class="lp-modal-overlay" style="display:none;">
                <div class="lp-modal">
                    <h3>Filtros de accesibilidad y servicios</h3>
                    <div class="lp-modal-body">
                        <div class="form-row"><label><input type="checkbox" id="filt-wheelchair-entrance"> Acceso silla de ruedas</label></div>
                        <div class="form-row"><label><input type="checkbox" id="filt-wheelchair-seating"> Asientos adaptados</label></div>
                        <hr class="form-divider-light">
                        <div class="form-row"><label><input type="checkbox" id="filt-outdoor"> Terraza</label></div>
                        <div class="form-row"><label><input type="checkbox" id="filt-dinein"> Comer allí</label></div>
                        <div class="form-row"><label><input type="checkbox" id="filt-delivery"> A domicilio</label></div>
                        <div class="form-row"><label><input type="checkbox" id="filt-takeout"> Para llevar</label></div>
                        <div class="form-row"><label><input type="checkbox" id="filt-curbside"> Recogida en coche</label></div>
                    </div>
                    <div class="lp-modal-actions">
                        <button id="extra-filters-apply" class="button primary">Aplicar</button>
                        <button id="extra-filters-clear" class="button secondary">Limpiar</button>
                        <button id="extra-filters-cancel" class="button secondary">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    
        

        <div id="reviews-grid-container" class="reviews-grid-container">
            </div>
    
        <div class="list-actions">
            <a href="#" id="edit-list-link" class="list-action-button edit-button" title="Editar esta lista" style="display: none;">
                <i class="fa-solid fa-pencil"></i> <span>Editar Lista</span></a>
            <button type="button" id="delete-list-button" class="list-action-button delete-button danger" title="Eliminar esta lista" style="display: none;">
                <i class="fa-solid fa-trash-can"></i> <span>Eliminar Lista</span></button>
        </div>
    </main>
    <footer> Listopic... Tu rincón personal de valoraciones. </footer>
    
    <!-- 
    // +++++Vamos a incluir un pequeño foro para la lista actual++++++ -->
    <div id="list-forum-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="forum-modal-title">Foro de la lista: <span id="forum-list-name"></span></h2>
            <div id="forum-messages-container">
                <!-- Messages will be loaded here -->
                <p>Cargando discusiones...</p>
            </div>
            <div class="forum-input-area">
                <textarea id="new-forum-message" placeholder="Escribe tu mensaje..."></textarea>
                <button id="send-forum-message" class="submit-button">Enviar</button>
            </div>
        </div>
    </div>
