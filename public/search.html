<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - Listopic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4.20.0/dist/algoliasearch-lite.umd.js"></script>

    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="header-actions-container">
        <div class="header-left-content">
            <div class="app-logo-container">
                <a href="Index.html" title="Ir a la pagina de inicio">
                    <img src="img/listopic-logo.png" alt="Listopic Logo" class="app-logo">
                </a>
            </div>
        </div>
        <div class="header-right-actions">
            <a href="search.html" id="search-link-button" class="search-button header-action-button" aria-label="Search">
                <i class="fas fa-search"></i>
            </a>
            <div class="user-profile-menu-container">
                <button class="user-profile-button header-action-button" id="userProfileBtn" aria-label="Menu de usuario" aria-expanded="false" aria-controls="userMenuDropdown">
                    <i class="fas fa-user-circle"></i>
                </button>
                <div class="user-menu" id="userMenuDropdown" role="menu" aria-labelledby="userProfileBtn">
                    <a href="profile.html" role="menuitem">Perfil</a>
                    <a href="profile.html#profile-email" role="menuitem">Datos</a>
                    <a href="profile.html#profile-my-lists" role="menuitem">Listas</a>
                    <a href="profile.html#profile-my-reviews" role="menuitem">Reviews</a>
                    <hr class="user-menu-divider">

                    <button type="button" role="menuitem" id="installPwaBtn" style="display: none;">
                        <i class="fas fa-download"></i> Instalar Aplicacion
                    </button>

                    <button type="button" role="menuitem" id="logoutBtnUserMenu">Cerrar sesion</button>
                </div>
            </div>
            <button id="theme-toggle-button" class="theme-toggle-button header-action-button" title="Cambiar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <main>
        <div class="container search-page-container">
            <h1 class="brand-title">Explora Listopic</h1>
            <div class="search-mobile-controls">
                <button type="button" id="filters-mobile-toggle" class="filters-mobile-toggle" aria-controls="search-filters-panel" aria-expanded="false">
                    <i class="fas fa-sliders-h"></i> Filtros
                </button>
            </div>
            <div class="search-layout">
                <aside class="search-filters-panel" id="search-filters-panel">
                    <div class="filters-panel-header">
                        <h2 id="filters-header-label">Filtros</h2>
                        <button type="button" id="close-filters-btn" class="filters-close-btn" aria-label="Cerrar filtros">
                            <i class="fas fa-times"></i>
                        </button>
                        <button type="button" id="clear-filters-btn" class="filters-clear-btn" disabled>Limpiar</button>
                        <button type="button" id="filters-mobile-close" class="filters-mobile-close" aria-label="Cerrar filtros">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="filters-type-block">
                        <h3 class="filters-type-title">Tipo de contenido</h3>
                        <p class="filters-type-helper">Elige que quieres explorar; usa Todo para buscar en general y afina con los filtros.</p>
                        <div id="filters-entity-type" class="filters-entity-type"></div>
                    </div>
                    <div id="filters-panel-content" class="filters-panel-content">
                        <p class="filters-placeholder">Selecciona un tipo de contenido para ver filtros.</p>
                    </div>
                </aside>
              
                <div id="filters-backdrop" class="filters-backdrop" hidden></div>


                <section class="search-results-column">
                    <button type="button" class="filters-toggle-btn" id="filters-toggle-btn" aria-controls="search-filters-panel" aria-expanded="false">
                        <i class="fas fa-sliders-h"></i> Filtros
                    </button>
                    <div class="search-input-area form-group">
                        <input type="search" id="main-search-input" class="form-input large-search-input" placeholder="Buscar elementos, listas, usuarios...">
                        <button type="button" id="execute-search-btn" class="submit-button primary-button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div id="active-filters-summary" class="active-filters-summary"></div>
                    <div id="search-results-area" class="search-results-container">
                        <p class="search-placeholder">Introduce tu busqueda o usa los filtros para descubrir contenido.</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
    <script src="js/themeManager.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/firebaseService.js" defer></script>
    <script src="js/uiUtils.js" defer></script>
    <script src="js/authService.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/page-search.js" defer></script>
</body>
</html>
