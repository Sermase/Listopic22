<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - Listopic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    
    <style>
        /* (Tus estilos de developer.html permanecen aquí, sin cambios) */
        main.dev-container { display: block !important; } .dev-container { padding-top: 80px; width: 95%; max-width: 1400px; margin: 0 auto; } .dev-main-tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; } .dev-main-tab-button { padding: 12px 20px; cursor: pointer; background: none; border: none; color: var(--secondary-text-color); font-size: 1.1em; font-weight: 500; border-bottom: 3px solid transparent; transition: all 0.2s ease-in-out; } .dev-main-tab-button:hover { color: var(--text-color); background-color: rgba(var(--accent-color-primary-rgb), 0.1); } .dev-main-tab-button.active { color: var(--accent-color-primary); border-bottom-color: var(--accent-color-primary); } .dev-tab-content { display: none; } #dev-tabs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; } .dev-tab-button { background-color: var(--container-bg-secondary); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; color: var(--secondary-text-color); transition: all 0.2s ease; } .dev-tab-button:hover { background-color: rgba(var(--text-color-rgb), 0.1); } .dev-tab-button.active { background-color: var(--accent-color-secondary); color: white; font-weight: 600; border-color: var(--accent-color-secondary);} .data-table-wrapper { width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: 6px; } .data-table { width: 100%; border-collapse: collapse; font-size: 0.9em; } .data-table th, .data-table td { padding: 8px 12px; border: 1px solid var(--border-color-light); text-align: left; white-space: nowrap; } .data-table th { background-color: var(--container-bg-secondary); position: sticky; top: 0; } .data-table tbody tr:hover { background-color: rgba(var(--accent-color-primary-rgb), 0.1); } .data-table tbody tr.selected { background-color: rgba(var(--accent-color-primary-rgb), 0.2); } .data-table pre { max-height: 100px; overflow: auto; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; } .dev-actions-container { padding: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; } .dev-actions-container .button:disabled { background-color: var(--disabled-bg); color: var(--disabled-text-color); cursor: not-allowed; opacity: 0.6; } #algolia-sync-log { background-color: var(--primary-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; min-height: 200px; max-height: 400px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; color: var(--text-color); } #algolia-sync-log p { margin: 0 0 5px 0; }
    </style>
</head>
<body>
    <div class="header-actions-container">
        <div class="header-left-content"> <div class="app-logo-container"><a href="Index.html" title="Ir a la página de inicio"><img src="img/listopic-logo.png" alt="Listopic Logo" class="app-logo"></a></div> </div>
        <div class="header-right-actions"> <a href="search.html" class="search-button header-action-button" aria-label="Search"><i class="fas fa-search"></i></a> <div class="user-profile-menu-container"> <button class="user-profile-button header-action-button" id="userProfileBtn" aria-label="Menú de usuario"><i class="fas fa-user-circle"></i></button> <div class="user-menu" id="userMenuDropdown"><a href="profile.html">Perfil</a><a href="profile.html#profile-my-lists">Mis Listas</a><hr class="user-menu-divider"><button type="button" id="logoutBtnUserMenu">Cerrar sesión</button></div> </div> <button id="theme-toggle-button" class="theme-toggle-button header-action-button" title="Cambiar tema"><i class="fas fa-moon"></i></button> </div>
    </div>
    <main class="dev-container">
        <h1><i class="fas fa-tools"></i> Panel de Desarrollador</h1>
        <div class="dev-main-tabs"> <button class="dev-main-tab-button active" data-tab="data">Data Viewer</button> <button class="dev-main-tab-button" data-tab="algolia">Algolia Sync</button> </div>
        <div id="tab-content-data" class="dev-tab-content" style="display: block;"> <div id="dev-tabs-container"></div> <div class="dev-actions-container"> <button id="export-csv-btn" class="button">Exportar a CSV</button> <button id="update-all-places-btn" class="button secondary-button">Actualizar TODO (Places)</button> <button id="update-selected-btn" class="button secondary-button" disabled>Actualizar Selección</button> <button id="delete-selected-btn" class="button danger-button" disabled>Eliminar Selección</button> </div> <div id="dev-content-container"></div> </div>
        <div id="tab-content-algolia" class="dev-tab-content" style="display: none;">
            <h3>Sincronización Manual con Algolia</h3>
            <p>Usa estos botones para forzar la re-indexación de las colecciones en Algolia.</p>
            <div class="dev-actions-container"> <button id="algolia-sync-all-btn" class="button primary-button"><i class="fas fa-sync"></i> Sincronizar TODO</button> <button id="algolia-sync-lists-btn" class="button secondary-button">Sincronizar 'lists'</button> <button id="algolia-sync-users-btn" class="button secondary-button">Sincronizar 'users'</button> <button id="algolia-sync-places-btn" class="button secondary-button">Sincronizar 'places'</button> </div>
            <h4>Log de Sincronización:</h4> <div id="algolia-sync-log"> <p><code>Esperando acciones...</code></p> </div>
        </div>
    </main>
    <footer><p>&copy; 2024 Listopic. All rights reserved.</p></footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/firebaseService.js"></script>
    <script src="js/themeManager.js"></script>
    <script src="js/authService.js"></script>
    <script src="js/page-developer.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (ListopicApp && ListopicApp.authService) {
                ListopicApp.authService.onAuthStateChangedPromise().then(user => {
                    if (ListopicApp.pageDeveloper && ListopicApp.pageDeveloper.init) {
                        ListopicApp.pageDeveloper.init();
                    }
                });
            } else {
                 console.error("DEVELOPER.HTML: El servicio de autenticación no está listo.");
            }
        });
    </script>
</body>
</html>
