<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Lugar - Listopic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="site.webmanifest"> 
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    
    </head>

<body>
    <div class="header-actions-container">
        <div class="header-left-content">
            <div class="app-logo-container">
                <a href="Index.html" title="Ir a la página de inicio">
                    <img src="img/listopic-logo.png" alt="Listopic Logo" class="app-logo">
                </a>
            </div>
        </div>
        <div class="header-right-actions">
            <a href="search.html" id="search-link-button" class="search-button header-action-button icon-with-badge" aria-label="Buscar">
                <i class="fas fa-search"></i>
            </a>
            <a href="chats.html" id="chats-link-button" class="header-action-button icon-with-badge" aria-label="Chats">
                <i class="fas fa-comments"></i>
                <span class="badge-indicator" id="chats-badge" hidden></span>
            </a>
            <div class="header-icon-group">
                <button id="notifications-button" class="header-action-button icon-with-badge" aria-label="Notificaciones" aria-expanded="false" aria-haspopup="true">
                    <i class="fas fa-bell"></i>
                    <span class="badge-indicator" id="notifications-badge" hidden></span>
                </button>
                <div id="notifications-dropdown" class="notifications-dropdown" role="menu" aria-hidden="true">
                    <h4>Notificaciones</h4>
                    <p class="notifications-empty-state">Sin notificaciones nuevas.</p>
                    <div class="notifications-list" id="notifications-list" hidden></div>
                </div>
            </div>
            <div class="user-profile-menu-container">
                <button class="user-profile-button header-action-button" id="userProfileBtn" aria-label="Menú de usuario" aria-expanded="false" aria-controls="userMenuDropdown">
                    <i class="fas fa-user-circle"></i>
                </button>
                <div class="user-menu" id="userMenuDropdown" role="menu" aria-labelledby="userProfileBtn">
                    <a href="profile.html" role="menuitem">Perfil</a>
                    <a href="profile.html#profile-my-lists" role="menuitem">Mis Listas</a>
                    <hr class="user-menu-divider">
                    <button type="button" role="menuitem" id="logoutBtnUserMenu">Cerrar sesión</button>
                </div>
            </div>
            <button id="theme-toggle-button" class="theme-toggle-button header-action-button" title="Cambiar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <main>
        <div class="container place-detail-page-container">
            <div class="place-header-container">
                <div class="place-photo-container">
                    <img id="place-photo" src="img/logo-listopic400.png" alt="Foto del lugar">
                </div>
                <div class="place-info-main">
                    <h1 id="place-name">Cargando...</h1>
                    
                    <p id="place-address"><i class="fas fa-map-marker-alt"></i> <span>Cargando...</span></p>

                    <p id="place-website-container" style="display: none;">
                        <i class="fas fa-globe"></i> <a id="place-website" href="#" target="_blank" rel="noopener noreferrer"></a>
                    </p>
                    <p id="place-phone-container" style="display: none;">
                        <i class="fas fa-phone"></i> <span id="place-phone"></span>
                    </p>
                    <p id="place-hours-container" style="display: none;">
                        <i class="fas fa-clock"></i> <span id="place-hours"></span>
                    </p>
                    <p id="place-price-container" style="display: none;">
                        <i class="fas fa-money-bill-wave"></i> <span id="place-price"></span>
                    </p>
                    
                    <div class="place-actions">
                        <a id="place-google-maps-link" href="#" target="_blank" class="button secondary-button">
                            <i class="fas fa-map"></i> Ver en Google Maps
                        </a>
                        <a id="add-review-global-btn" class="button secondary-button" style="display:none;" href="#">
                            <i class="fas fa-plus"></i> Valorar este lugar
                        </a>
                        <button id="follow-unfollow-place-btn" class="button primary-button" style="display: none;">
                            <i class="fas fa-bookmark"></i> Seguir Lugar
                        </button>
                    </div>

                    <div id="place-attributes" class="place-attributes">
                        <div class="attr-group" id="place-accessibility"></div>
                        <div class="attr-group" id="place-services"></div>
                    </div>
                </div>
            </div>

            <div class="place-stats-container">
                <div class="stat-item">
                    <span class="count" id="place-avg-rating">N/A</span>
                    <span class="label">Listopic</span>
                </div>
                <div class="stat-item">
                    <span class="count" id="place-google-rating">N/A</span>
                    <span class="label">Google</span>
                </div>
                <div class="stat-item">
                    <span class="count" id="place-review-count">0</span>
                    <span class="label">Reseñas</span>
                </div>
                <!-- <div class="stat-item">
                    <span class="count" id="place-lists-count">0</span>
                    <span class="label">Veces en Listas</span>
                </div> -->
                 <div class="stat-item">
                    <span class="count" id="place-followers-count">0</span>
                    <span class="label">Seguidores</span>
                </div>
            </div>

            <div class="profile-tabs">
                <button class="profile-tab-button active" data-tab="reviews">
                    <i class="fas fa-star"></i> <span class="tab-text">RESEÑAS</span>
                </button>
                <button class="profile-tab-button" data-tab="groups">
                    <i class="fas fa-utensils"></i> <span class="tab-text">ELEMENTOS</span>
                </button>
            </div>
            
            <div class="profile-content">
                <div id="reviews-content" class="profile-tab-content active">
                    <div id="place-reviews-container">
                        <p class="loading-placeholder">Cargando reseñas...</p>
                    </div>
                </div>
                <div id="groups-content" class="profile-tab-content">
                     <div id="place-groups-container">
                         <p class="loading-placeholder">Buscando grupos...</p>
                     </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; <span id="current-year"></span> Listopic. All rights reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/firebaseService.js" defer></script>
    <script src="js/authService.js" defer></script>
    <script src="js/places-service.js" defer></script>
    
    <script src="js/uiUtils.js" defer></script>
    <script src="js/themeManager.js" defer></script>
    
    <script src="js/page-place-detail.js" defer></script>
    
    <script src="js/main.js" defer></script>

</body>
</html>
